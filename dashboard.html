<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rage — license manager</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0d0d;
    --surface: #161616;
    --border:  #2a2a2a;
    --accent:  #ffffff;
    --green:   #4ade80;
    --red:     #f87171;
    --yellow:  #facc15;
    --dim:     #606060;
    --text:    #e0e0e0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Login ── */
  #login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 360px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .login-box h1 { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
  .login-box p  { color: var(--dim); font-size: 13px; }
  .login-error  { color: var(--red); font-size: 12px; display: none; }

  /* ── App ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; flex: 1; }
  .stat      { color: var(--dim); font-size: 13px; }
  .stat span { color: var(--text); font-weight: 600; margin-left: 4px; }

  main { padding: 28px; flex: 1; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .search {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: 8px 14px;
    font-size: 13px;
    outline: none;
  }
  .search:focus { border-color: #444; }

  /* ── Buttons ── */
  .btn {
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .btn:hover   { opacity: .8; }
  .btn:active  { opacity: .6; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-danger  { background: #2a1212; color: var(--red);   border: 1px solid #4a1f1f; }
  .btn-success { background: #0f2a18; color: var(--green); border: 1px solid #1a4a28; }
  .btn-ghost   { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-sm      { padding: 5px 10px; font-size: 12px; }

  input[type=text], input[type=password] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: 9px 14px;
    font-size: 13px;
    width: 100%;
    outline: none;
  }
  input:focus { border-color: #444; }

  /* ── Table ── */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #111;
    color: var(--dim);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 11px 16px;
    text-align: left;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,.03); }
  td { padding: 12px 16px; font-size: 13px; }

  .key-cell {
    font-family: monospace;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .copy-btn {
    background: none;
    border: none;
    color: var(--dim);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .copy-btn:hover { color: var(--text); background: var(--border); }

  .badge {
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    padding: 3px 8px;
    text-transform: uppercase;
  }
  .badge-active  { background: #0f2a18; color: var(--green); }
  .badge-revoked { background: #2a1212; color: var(--red);   }
  .badge-unbound { background: #1a1a0a; color: var(--yellow); }

  .actions { display: flex; gap: 6px; }

  .empty { text-align: center; color: var(--dim); padding: 48px; font-size: 13px; }

  /* ── Modal ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 380px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal h2      { font-size: 16px; }
  .modal label   { color: var(--dim); font-size: 12px; display: block; margin-bottom: 5px; }
  .modal-footer  { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .modal-note    { color: var(--dim); font-size: 12px; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: #1e1e1e;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 10px 18px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity .2s, transform .2s;
    z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────────────── -->
<div id="login">
  <div class="login-box">
    <h1>rage</h1>
    <p>Enter your admin secret to continue.</p>
    <input id="secretInput" type="password" placeholder="Admin secret" autocomplete="off">
    <div class="login-error" id="loginErr">Wrong secret.</div>
    <button class="btn btn-primary" onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────────────────────── -->
<div id="app">
  <header>
    <h1>rage — licenses</h1>
    <div class="stat">Total<span id="statTotal">0</span></div>
    <div class="stat">Active<span id="statActive">0</span></div>
    <div class="stat">Revoked<span id="statRevoked">0</span></div>
  </header>

  <main>
    <div class="toolbar">
      <input class="search" id="search" type="text" placeholder="Search key…" oninput="renderTable()">
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Key</button>
      <button class="btn btn-ghost"   onclick="loadKeys()">↻ Refresh</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Key</th>
            <th>Status</th>
            <th>HWID</th>
            <th>Created</th>
            <th>Last seen</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- ── Add Key Modal ─────────────────────────────────────────────────────── -->
<div class="overlay" id="addModal">
  <div class="modal">
    <h2>Add license key</h2>
    <div>
      <label>Custom key (leave blank to auto-generate)</label>
      <input id="customKey" type="text" placeholder="RAGE-XXXX-XXXX-XXXX">
    </div>
    <p class="modal-note">The key will be unbound until a buyer uses it for the first time. Their PC's HWID will bind automatically on first use.</p>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-primary" onclick="addKey()">Generate</button>
    </div>
  </div>
</div>

<!-- ── Toast ─────────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
  let SECRET = ''
  let allKeys = {}

  // ── Login ──────────────────────────────────────────────────────────────────

  document.getElementById('secretInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin()
  })

  async function doLogin() {
    const s = document.getElementById('secretInput').value.trim()
    if (!s) return
    const res = await api('/admin/list', { secret: s })
    if (!res || !res.ok) {
      document.getElementById('loginErr').style.display = 'block'
      return
    }
    SECRET = s
    allKeys = res.keys || {}
    document.getElementById('login').style.display = 'none'
    document.getElementById('app').style.display = 'flex'
    renderTable()
  }

  // ── Load / Render ──────────────────────────────────────────────────────────

  async function loadKeys() {
    const res = await api('/admin/list', { secret: SECRET })
    if (!res || !res.ok) return toast('Failed to load keys', true)
    allKeys = res.keys || {}
    renderTable()
  }

  function renderTable() {
    const q     = document.getElementById('search').value.toLowerCase()
    const tbody = document.getElementById('tbody')
    const rows  = Object.entries(allKeys)
      .filter(([k]) => k.toLowerCase().includes(q))
      .sort((a, b) => (b[1].createdAt || '').localeCompare(a[1].createdAt || ''))

    let total = 0, active = 0, revoked = 0
    Object.values(allKeys).forEach(e => {
      total++
      e.active ? active++ : revoked++
    })
    document.getElementById('statTotal').textContent   = total
    document.getElementById('statActive').textContent  = active
    document.getElementById('statRevoked').textContent = revoked

    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No keys yet. Click <b>+ Add Key</b> to create one.</td></tr>'
      return
    }

    tbody.innerHTML = rows.map(([key, e]) => {
      const statusBadge = e.active
        ? '<span class="badge badge-active">Active</span>'
        : '<span class="badge badge-revoked">Revoked</span>'

      const hwidBadge = e.hwid
        ? '<span class="badge badge-active">Bound</span>'
        : '<span class="badge badge-unbound">Unbound</span>'

      const created  = e.createdAt  ? fmtDate(e.createdAt)  : '—'
      const lastSeen = e.lastSeen   ? fmtDate(e.lastSeen)   : '—'

      const toggleBtn = e.active
        ? `<button class="btn btn-sm btn-danger"  onclick="revokeKey('${key}')">Revoke</button>`
        : `<button class="btn btn-sm btn-success" onclick="activateKey('${key}')">Activate</button>`

      const hwidBtn = e.hwid
        ? `<button class="btn btn-sm btn-ghost" onclick="resetHwid('${key}')">Reset HWID</button>`
        : ''

      return `
        <tr>
          <td>
            <div class="key-cell">
              <span>${key}</span>
              <button class="copy-btn" title="Copy key" onclick="copyText('${key}')">⎘</button>
            </div>
          </td>
          <td>${statusBadge}</td>
          <td>${hwidBadge}</td>
          <td>${created}</td>
          <td>${lastSeen}</td>
          <td>
            <div class="actions">
              ${toggleBtn}
              ${hwidBtn}
            </div>
          </td>
        </tr>`
    }).join('')
  }

  // ── Actions ────────────────────────────────────────────────────────────────

  function openAddModal() {
    document.getElementById('customKey').value = ''
    document.getElementById('addModal').classList.add('open')
  }

  async function addKey() {
    const custom = document.getElementById('customKey').value.trim()
    const body   = { secret: SECRET }
    if (custom) body.key = custom
    const res = await api('/admin/add', body)
    if (!res || !res.ok) return toast(res?.msg || 'Error', true)
    toast('Key added: ' + res.key)
    closeModal('addModal')
    copyText(res.key)
    await loadKeys()
  }

  async function revokeKey(key) {
    const res = await api('/admin/revoke', { secret: SECRET, key })
    if (!res || !res.ok) return toast(res?.msg || 'Error', true)
    toast('Revoked: ' + key)
    await loadKeys()
  }

  async function activateKey(key) {
    const res = await api('/admin/activate', { secret: SECRET, key })
    if (!res || !res.ok) return toast(res?.msg || 'Error', true)
    toast('Activated: ' + key)
    await loadKeys()
  }

  async function resetHwid(key) {
    if (!confirm('Reset HWID for ' + key + '?\nThe buyer can bind a new PC on next use.')) return
    const res = await api('/admin/reset-hwid', { secret: SECRET, key })
    if (!res || !res.ok) return toast(res?.msg || 'Error', true)
    toast('HWID reset: ' + key)
    await loadKeys()
  }

  // ── Helpers ────────────────────────────────────────────────────────────────

  async function api(endpoint, body) {
    try {
      const r = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      })
      return await r.json()
    } catch { return null }
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open')
  }

  function fmtDate(iso) {
    const d = new Date(iso)
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).catch(() => {})
    toast('Copied: ' + text)
  }

  let toastTimer = null
  function toast(msg, isErr = false) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.style.borderColor = isErr ? '#4a1f1f' : '#2a2a2a'
    el.classList.add('show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500)
  }

  // Close modals on overlay click
  document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open') })
  })
</script>
</body>
</html>
