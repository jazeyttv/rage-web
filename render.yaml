services:
  - type: web
    name: rage-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rage-db
          property: connectionString

databases:
  - name: rage-db
    databaseName: rage
    plan: free
